<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>关联车辆近期卡口点位图 · 天地图</title>
  <style>
    :root{--bg:#07111f;--panel:#0d1b2c;--panel2:#13243a;--line:#263a52;--text:#eef6ff;--muted:#91a5bd;--accent:#33d0bd;--blue:#60a5fa;--amber:#fbbf24;--danger:#fb7185}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit}.app{height:100%;display:grid;grid-template-columns:370px 1fr;overflow:hidden}.sidebar{z-index:20;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,#0d1b2c 0%,#091524 100%);border-right:1px solid var(--line);box-shadow:12px 0 35px rgba(0,0,0,.24)}
    .head{padding:22px 22px 16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{margin:7px 0 6px;font-size:24px;line-height:1.25;font-weight:650}.muted{font-size:12px;color:var(--muted);line-height:1.55}
    .filters{padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(19,36,58,.7)}.filter-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:13px;font-weight:600}.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.date-grid label{display:grid;gap:5px;font-size:11px;color:var(--muted)}input[type=date]{width:100%;min-width:0;padding:8px 9px;color:var(--text);background:#071321;border:1px solid #314861;border-radius:7px;color-scheme:dark}.filter-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.btn{border:1px solid #38516c;border-radius:7px;padding:8px 12px;cursor:pointer;color:var(--text);background:#162940}.btn.primary{border-color:#25a997;background:#1a746b}.btn:hover{filter:brightness(1.1)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:13px 18px;border-bottom:1px solid var(--line)}.stat{padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:rgba(19,36,58,.72)}.stat b{display:block;font-size:20px;font-weight:650}.stat span{font-size:10px;color:var(--muted)}
    .list-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px 8px}.list-head strong{font-size:13px}.list-head span{font-size:11px;color:var(--muted)}.point-list{overflow:auto;padding:0 10px 18px}.point{display:grid;grid-template-columns:32px 1fr auto;gap:9px;align-items:center;width:100%;margin:4px 0;padding:10px;border:0;border-radius:8px;text-align:left;color:var(--text);background:transparent;cursor:pointer}.point:hover{background:var(--panel2)}.rank{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:11px;font-weight:700;color:#06201c;background:var(--accent)}.point-name{font-size:12px;line-height:1.35}.point-time{font-size:10px;color:var(--muted);margin-top:3px}.point-count{font-size:13px;font-weight:650;color:#dffdf8}
    .map-wrap{position:relative;min-width:0}.map{position:absolute;inset:0;background:#dfe7ef}.map-status{position:absolute;z-index:12;top:14px;left:14px;padding:8px 11px;border-radius:8px;color:#16324a;background:rgba(255,255,255,.94);box-shadow:0 4px 16px rgba(20,35,55,.18);font-size:12px}.map-status.ok{color:#166534;background:rgba(240,253,244,.96)}.map-status.error{color:#991b1b;background:rgba(254,242,242,.97)}.mobile-toggle{display:none;position:absolute;z-index:30;top:14px;right:14px;border:0;border-radius:8px;padding:9px 12px;color:#fff;background:#0d1b2c;box-shadow:0 5px 18px rgba(0,0,0,.25)}
    .popup{min-width:250px;color:#142033}.popup h3{margin:0 0 7px;font-size:14px}.popup table{width:100%;border-collapse:collapse;font-size:12px}.popup td{padding:3px 0;vertical-align:top}.popup td:first-child{width:72px;color:#64748b}.times{max-height:110px;overflow:auto;margin-top:7px;padding:6px 8px;border-radius:5px;background:#eff6ff;font-size:11px;line-height:1.5}
    @media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:absolute;inset:0 auto 0 0;width:min(90vw,370px);transform:translateX(-102%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.mobile-toggle{display:block}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="head">
        <div class="eyebrow">Tianditu · original camera records</div>
        <h1>关联车辆近期卡口点位图</h1>
        <div class="muted" id="period">加载数据…</div>
      </div>
      <section class="filters" aria-label="日期筛选">
        <div class="filter-title"><span>显示日期区间</span><span id="filterHint">默认全部</span></div>
        <div class="date-grid">
          <label>开始日期<input id="startDate" type="date"></label>
          <label>结束日期<input id="endDate" type="date"></label>
        </div>
        <div class="filter-actions">
          <button class="btn primary" id="applyFilter" type="button">显示所选区间</button>
          <button class="btn" id="resetFilter" type="button">全部</button>
        </div>
      </section>
      <section class="stats" aria-label="筛选统计">
        <div class="stat"><b id="eventCount">—</b><span>过车记录</span></div>
        <div class="stat"><b id="pointCount">—</b><span>有记录点位</span></div>
        <div class="stat"><b id="activeDays">—</b><span>涉及日期</span></div>
      </section>
      <div class="list-head"><strong>区间内高频点位</strong><span>点击定位</span></div>
      <div class="point-list" id="pointList"></div>
    </aside>
    <main class="map-wrap">
      <div id="map" class="map" aria-label="天地图底图与卡口点位"></div>
      <div id="mapStatus" class="map-status">正在加载天地图…</div>
      <button class="mobile-toggle" id="mobileToggle" type="button">筛选与列表</button>
    </main>
  </div>
  <script src="runtime-config.js"></script>
  <script src="map_data.js"></script>
  <script>
  (()=>{
    const DATA=window.TRAFFIC_MAP_DATA,meta=DATA.metadata;
    const $=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const startDefault=meta.start_time.slice(0,10),endDefault=meta.end_time.slice(0,10);
    $('startDate').value=startDefault;$('startDate').min=startDefault;$('startDate').max=endDefault;
    $('endDate').value=endDefault;$('endDate').min=startDefault;$('endDate').max=endDefault;
    $('period').textContent=`${meta.start_time} — ${meta.end_time} · ${meta.record_count.toLocaleString()} 条原始记录`;
    let map=null,activeRows=[],markerByLocation=new Map();

    function setMapStatus(text,kind=''){$('mapStatus').textContent=text;$('mapStatus').className=`map-status ${kind}`.trim()}
    function filteredRows(start,end){return DATA.points.features.map(feature=>{const all=feature.properties.event_times||[];const times=all.filter(t=>t.slice(0,10)>=start&&t.slice(0,10)<=end).slice().sort();return {feature,times,count:times.length}}).filter(row=>row.count>0)}
    function fitRows(rows){if(!rows.length)return;const coords=rows.map(r=>r.feature.geometry.coordinates);const lngs=coords.map(c=>c[0]),lats=coords.map(c=>c[1]);const minLng=Math.min(...lngs),maxLng=Math.max(...lngs),minLat=Math.min(...lats),maxLat=Math.max(...lats);const center=new T.LngLat((minLng+maxLng)/2,(minLat+maxLat)/2);const span=Math.max(maxLng-minLng,(maxLat-minLat)*1.18);const zoom=span>.45?9:span>.25?10:span>.13?11:span>.07?12:span>.035?13:span>.018?14:span>.009?15:16;map.centerAndZoom(center,zoom)}
    function popupHtml(row){const p=row.feature.properties,t=row.times;const quality={intersection_verified:'双道路/路口核验',poi_or_address:'地址或POI',road_or_area_approximate:'道路级近似'}[p.geocode_quality]||p.geocode_quality||'—';return `<div class="popup"><h3>${esc(p.location)}</h3><table><tr><td>卡口编号</td><td>${esc(p.camera_code||'—')}</td></tr><tr><td>区间次数</td><td><b>${row.count}</b> / 全部 ${p.hit_count}</td></tr><tr><td>区间时间</td><td>${esc(t[0])}<br>${esc(t[t.length-1])}</td></tr><tr><td>坐标质量</td><td>${esc(quality)}</td></tr><tr><td>原始地址</td><td>${esc(p.location)}</td></tr><tr><td>坐标</td><td>${Number(row.feature.geometry.coordinates[0]).toFixed(6)}, ${Number(row.feature.geometry.coordinates[1]).toFixed(6)}</td></tr></table><div class="times">${t.slice().reverse().slice(0,20).map(esc).join('<br>')}</div></div>`}
    function openRow(row){const c=row.feature.geometry.coordinates,marker=markerByLocation.get(row.feature.properties.location);map.centerAndZoom(new T.LngLat(c[0],c[1]),16);if(marker)marker.openInfoWindow(new T.InfoWindow(popupHtml(row),{closeButton:true,offset:new T.Point(0,-20)}))}
    function lastTime(row){return row.times[row.times.length-1]||''}
    function renderList(rows){const list=$('pointList');list.innerHTML='';rows.slice().sort((a,b)=>b.count-a.count||String(lastTime(b)).localeCompare(String(lastTime(a)))).slice(0,30).forEach((row,index)=>{const p=row.feature.properties,button=document.createElement('button');button.type='button';button.className='point';button.innerHTML=`<span class="rank">${index+1}</span><span><span class="point-name">${esc(p.location)}</span><span class="point-time">最近 ${esc(lastTime(row))}</span></span><span class="point-count">${row.count}</span>`;button.onclick=()=>{openRow(row);if(innerWidth<=820)$('sidebar').classList.remove('open')};list.appendChild(button)});if(!rows.length)list.innerHTML='<div class="muted" style="padding:12px">所选日期区间没有点位记录。</div>'}
    function renderMarkers(rows){map.clearOverLays();markerByLocation=new Map();rows.forEach(row=>{const c=row.feature.geometry.coordinates,marker=new T.Marker(new T.LngLat(c[0],c[1]));marker.addEventListener('click',()=>marker.openInfoWindow(new T.InfoWindow(popupHtml(row),{closeButton:true,offset:new T.Point(0,-20)})));map.addOverLay(marker);markerByLocation.set(row.feature.properties.location,marker)});fitRows(rows)}
    function applyFilter(){const start=$('startDate').value,end=$('endDate').value;if(!start||!end||start>end){setMapStatus('日期区间无效','error');return}activeRows=filteredRows(start,end);const eventCount=activeRows.reduce((sum,row)=>sum+row.count,0);const days=new Set(activeRows.flatMap(row=>row.times.map(t=>t.slice(0,10))));$('eventCount').textContent=eventCount.toLocaleString();$('pointCount').textContent=activeRows.length.toLocaleString();$('activeDays').textContent=days.size.toLocaleString();$('filterHint').textContent=start===startDefault&&end===endDefault?'全部时间':`${start} 至 ${end}`;renderList(activeRows);if(map){renderMarkers(activeRows);setMapStatus(`已显示 ${eventCount.toLocaleString()} 条记录、${activeRows.length.toLocaleString()} 个点位`,'ok')}window.__TDT_FILTER_STATE__={start,end,eventCount,pointCount:activeRows.length,activeDays:days.size}}
    $('applyFilter').onclick=applyFilter;$('resetFilter').onclick=()=>{$('startDate').value=startDefault;$('endDate').value=endDefault;applyFilter()};$('mobileToggle').onclick=()=>$('sidebar').classList.toggle('open');
    const token=window.TDT_RUNTIME_CONFIG&&window.TDT_RUNTIME_CONFIG.token;if(!token){setMapStatus('缺少天地图 API 密钥','error');return}
    const script=document.createElement('script');script.src=`https://api.tianditu.gov.cn/api?v=4.0&tk=${encodeURIComponent(token)}`;script.async=true;script.onload=()=>{try{map=new T.Map('map',{projection:'EPSG:900913'});map.centerAndZoom(new T.LngLat(121.27,31.37),11);map.enableScrollWheelZoom();map.addControl(new T.Control.Zoom());applyFilter();window.__TDT_MAP_READY__=true}catch(error){setMapStatus(`天地图初始化失败：${error.message}`,'error');window.__TDT_MAP_ERROR__=String(error)}};script.onerror=()=>{setMapStatus('天地图 API 加载失败','error');window.__TDT_MAP_ERROR__='script_load_failed'};document.head.appendChild(script);
    applyFilter();
  })();
  </script>
</body>
</html>
