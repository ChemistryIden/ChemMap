<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>孙振团伙关联车辆近期卡口地图 · 高德版</title>
  <script src="runtime-config.js?v=20260730-amap-cluster-fix"></script>
  <script src="map_data.js?v=20260730"></script>
  <style>
    :root{--navy:#0a1423;--panel:#0f1d2e;--panel2:#14243a;--line:#263b55;--ink:#ecf4fb;--muted:#8fa4b9;--cyan:#2dd4bf;--blue:#60a5fa;--amber:#fbbf24;--orange:#f59e0b;--red:#fb7185}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}.app{position:fixed;inset:0;display:grid;grid-template-columns:380px 1fr}.sidebar{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#0c1929,#0a1423);border-right:1px solid var(--line);z-index:3}
    .head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}.head h1{font-size:20px;line-height:1.35;margin:7px 0 6px}.muted{color:var(--muted)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}.stat{background:rgba(20,36,58,.72);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.stat b{display:block;font-size:19px;color:#fff}.stat span{font-size:11px;color:var(--muted)}
    .date-filter,.vehicle-filter{margin:0 16px 12px;padding:12px;background:rgba(20,36,58,.55);border:1px solid var(--line);border-radius:11px}.filter-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.filter-head b{font-size:13px}.filter-head span{font-size:11px;color:var(--muted)}
    .date-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.date-grid label{display:block;color:var(--muted);font-size:11px}.date-grid input{display:block;width:100%;margin-top:4px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#0a1727;color:var(--ink);color-scheme:dark;outline:none}.date-grid input:focus{border-color:var(--blue)}
    .filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.filter-actions button,.tools button,.search{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 10px}.filter-actions button{cursor:pointer}.filter-actions .primary{border-color:#168878;background:#123831;color:#89f3e1}.filter-status{min-height:18px;margin-top:7px;color:var(--muted);font-size:11px}.filter-status.error{color:var(--red)}
    .vehicle-grid{display:grid;gap:7px}.vehicle-choice{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:#0a1727;cursor:pointer}.vehicle-choice input{accent-color:var(--vehicle-color)}.vehicle-choice .swatch{width:12px;height:12px;border-radius:50%;background:var(--vehicle-color);box-shadow:0 0 0 2px rgba(255,255,255,.16)}.vehicle-choice span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vehicle-choice small{margin-left:auto;color:var(--muted);font-size:10px}
    .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}.tools button{cursor:pointer;text-align:left}.tools button.active{border-color:var(--cyan);color:var(--cyan);background:#102d34}
    .search-wrap{padding:0 16px 10px}.search{width:100%;outline:none}.search:focus{border-color:var(--blue)}.list-head{display:flex;justify-content:space-between;padding:0 18px 7px;color:var(--muted);font-size:12px}.point-list{flex:none;min-height:120px;overflow:visible;padding:0 8px 18px}.point{display:grid;grid-template-columns:34px 1fr 42px;gap:9px;align-items:center;padding:9px;border-radius:9px;cursor:pointer;border:1px solid transparent}.point:hover{background:var(--panel2);border-color:var(--line)}
    .rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#17314a;color:#fff;font-weight:700;border:2px solid var(--vehicle-color)}.point-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.point-time,.point-vehicle{font-size:11px;color:var(--muted)}.point-vehicle{color:var(--vehicle-color)}.count{text-align:right;color:var(--amber);font-weight:700}
    .map-wrap,#map{position:relative;width:100%;height:100%}.floating{position:absolute;z-index:2;top:16px;right:16px;display:flex;gap:8px}.floating button{border:1px solid rgba(255,255,255,.25);background:rgba(9,18,31,.84);backdrop-filter:blur(10px);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.floating button.active{background:#fff;color:#0b1725}
    .legend{position:absolute;z-index:2;left:16px;bottom:28px;max-width:350px;background:rgba(9,18,31,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;color:#d8e4ef;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.legend div+div{margin-top:5px}.legend .line{width:16px;height:3px;border-radius:2px;vertical-align:middle}.legend .key-legend,.legend .cluster-legend{width:18px;height:18px;border-radius:50%;color:#fff;line-height:18px;text-align:center;font-style:normal;font-weight:800;vertical-align:middle;box-shadow:0 0 0 2px #fff}.legend .key-legend{background:#dc2626}.legend .cluster-legend{background:#2563eb;font-size:10px}
    .loading{position:absolute;z-index:4;top:76px;right:16px;max-width:360px;padding:9px 12px;border:1px solid rgba(255,255,255,.22);border-radius:9px;background:rgba(9,18,31,.9);color:#fff;backdrop-filter:blur(10px)}.loading.error{border-color:var(--red);color:#ffd3dc}
    .amap-cluster-marker,.amap-camera-marker{appearance:none;display:grid;place-items:center;padding:0;border-radius:50%;color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.42)}.amap-cluster-marker{border:2px solid rgba(255,255,255,.92);background:var(--marker-color);font-weight:800;line-height:1}.amap-cluster-marker:hover{filter:brightness(1.12);transform:scale(1.06)}.amap-camera-marker{width:18px;height:18px;border:var(--marker-stroke-width,2px) solid var(--marker-stroke,#fff);background:var(--marker-color)}.amap-camera-marker:hover{transform:scale(1.18)}
    .key-location-marker{appearance:none;position:relative;display:block;width:32px;height:32px;padding:0;background:transparent;border:0;overflow:visible;cursor:pointer;filter:drop-shadow(0 3px 7px rgba(0,0,0,.55))}.key-location-marker .key-flag{display:grid;place-items:center;width:32px;height:32px;border:3px solid #fff;border-radius:50%;background:#dc2626;color:#fff;font-size:19px;font-weight:900;line-height:1;box-shadow:0 0 0 3px rgba(220,38,38,.32)}.key-location-marker .key-label{position:absolute;left:38px;top:3px;max-width:150px;padding:5px 8px;border:2px solid #dc2626;border-radius:8px;background:rgba(255,255,255,.96);color:#7f1d1d;font-size:12px;font-weight:800;line-height:1.25;white-space:nowrap}.key-location-marker.label-left .key-label{left:auto;right:38px}.key-location-marker:hover .key-flag{transform:scale(1.12);background:#ef4444}
    .custom-info{min-width:290px;max-width:390px;padding:14px;border:1px solid #34506d;border-radius:12px;background:#0f1d2e;color:#ecf4fb;box-shadow:0 16px 45px rgba(0,0,0,.42);position:relative}.custom-info h3{font-size:15px;margin:0 26px 8px 0}.custom-info table{width:100%;border-collapse:collapse;font-size:12px}.custom-info td{padding:4px 0;border-top:1px solid #263b55;vertical-align:top}.custom-info td:first-child{color:#8fa4b9;width:76px}.custom-info .close{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#9fb3c7;font-size:20px;cursor:pointer}.times{max-height:118px;overflow:auto;margin-top:7px;color:#b9cad9;font-size:11px}.empty{padding:28px;color:var(--muted);text-align:center}
    @media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:5;width:min(92vw,380px);height:100%;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.mobile-toggle{display:block!important}.legend{left:auto;right:12px;bottom:22px;max-width:280px}.floating{right:12px;top:12px}.floating button{padding:8px 10px}.loading{top:62px;right:12px}}.mobile-toggle{display:none}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="head"><div class="eyebrow">AMap JS API 2.0 · GCJ-02</div><h1>孙振团伙关联车辆<br>近期卡口点位图</h1><div class="muted" id="period">加载数据…</div></div>
      <div class="stats"><div class="stat"><b id="records">—</b><span>所选过车记录</span></div><div class="stat"><b id="points">—</b><span>所选车辆-卡口点</span></div><div class="stat"><b id="activeDays">—</b><span>有记录日期</span></div><div class="stat"><b id="approximate">—</b><span>道路级近似点</span></div></div>
      <section class="date-filter" aria-label="日期筛选"><div class="filter-head"><b>日期区间</b><span>默认全部时间</span></div><div class="date-grid"><label>开始日期<input id="startDate" type="date"></label><label>结束日期<input id="endDate" type="date"></label></div><div class="filter-actions"><button id="applyDate" class="primary">应用筛选</button><button id="resetDate">恢复全部</button></div><div id="filterStatus" class="filter-status"></div></section>
      <section class="vehicle-filter" aria-label="车辆筛选"><div class="filter-head"><b>车辆筛选</b><span>可多选</span></div><div id="vehicleChoices" class="vehicle-grid"></div></section>
      <div class="tools"><button id="trackBtn">所选时段时序线　关</button><button id="heatBtn">热力视图　关</button></div>
      <div class="search-wrap"><input id="search" class="search" placeholder="搜索路口、道路或卡口编号"></div><div class="list-head"><span>所选时段高频点位</span><span>次数</span></div><div id="pointList" class="point-list"></div>
    </aside>
    <main class="map-wrap"><div id="map"></div><div id="loading" class="loading">正在加载高德地图…</div><div class="floating"><button id="mobileToggle" class="mobile-toggle">点位</button><button id="fitBtn">筛选全览</button><button id="streetBtn" class="active">街道</button><button id="satelliteBtn">卫星</button></div><div class="legend"><div id="vehicleLegend"></div><div><i class="cluster-legend">12</i>数字圆点：当前缩放下聚合卡口数</div><div><i class="key-legend">⚑</i>红旗：重点常去点位</div><div><i class="line" style="background:linear-gradient(90deg,#2dd4bf 0 50%,#f59e0b 50%)"></i>同色时序线：按车辆、按日分段（非真实轨迹）</div></div></main>
  </div>
  <script>
    const DATA=window.TRAFFIC_MAP_DATA,CONFIG=window.AMAP_RUNTIME_CONFIG||{};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const asArray=value=>Array.isArray(value)?value:(typeof value==='string'?JSON.parse(value||'[]'):[]);
    const emptyCollection=()=>({type:'FeatureCollection',features:[]});
    const KEY_LOCATIONS=[
      {name:'嘉行公路2605号',detail:'上海互赢物流 · 重点常去点位',coordinates:[121.24963012,31.43992389],locationNote:'按已确认位置：宝钱公路—嘉行公路路口北侧稍偏西静态定位',labelSide:'right'},
      {name:'励学路1111号',detail:'上海品亚实业 · 重点常去点位',coordinates:[121.30317366,31.36139856],locationNote:'门牌地址离线换算为 GCJ-02 静态定位',labelSide:'right'},
      {name:'丰兆路122号',detail:'车辆高频起止区域 · 重点常去点位',coordinates:[121.27790016,31.36209875],locationNote:'丰兆路—申裕路邻近卡口离线换算定位',labelSide:'left'}
    ];
    const loading=document.getElementById('loading');
    function showError(message){loading.textContent=message;loading.classList.add('error');console.error(message)}
    if(!DATA||!CONFIG.jsKey||!CONFIG.securityJsCode){showError('地图数据或高德运行配置尚未就绪。');throw new Error('missing map data/config')}

    const meta=DATA.metadata,vehicles=meta.vehicles||[],vehicleById=new Map(vehicles.map(vehicle=>[vehicle.id,vehicle]));
    const sourceFeatures=DATA.points.features.map((feature,index)=>({...feature,properties:{...feature.properties,_source_index:index}}));
    const featureByIndex=new Map(sourceFeatures.map(feature=>[Number(feature.properties._source_index),feature]));
    const allEvents=sourceFeatures.flatMap(feature=>asArray(feature.properties.event_times).map(time=>({time,date:time.slice(0,10),coordinates:feature.geometry.coordinates,sourceIndex:feature.properties._source_index,vehicleId:feature.properties.vehicle_id}))).sort((a,b)=>a.time.localeCompare(b.time));
    const vehicleChoices=document.getElementById('vehicleChoices');
    vehicleChoices.innerHTML=vehicles.map(vehicle=>`<label class="vehicle-choice" style="--vehicle-color:${vehicle.color}"><input type="checkbox" value="${esc(vehicle.id)}" checked><span class="swatch"></span><span>${esc(vehicle.label)}</span><small>${Number(vehicle.record_count).toLocaleString()}条</small></label>`).join('');
    document.getElementById('vehicleLegend').innerHTML=vehicles.map(vehicle=>`<div><i style="background:${vehicle.color}"></i>${esc(vehicle.short_label||vehicle.label)}</div>`).join('');
    const selectedVehicleIds=()=>new Set([...vehicleChoices.querySelectorAll('input:checked')].map(input=>input.value));
    const minDate=meta.start_time.slice(0,10),maxDate=meta.end_time.slice(0,10),startInput=document.getElementById('startDate'),endInput=document.getElementById('endDate');
    [startInput,endInput].forEach(input=>{input.min=minDate;input.max=maxDate});startInput.value=minDate;endInput.value=maxDate;

    let AMapLib,map,heatMap,infoWindow,streetLayers,satelliteLayers;
    const vehicleClusters=new Map(),clusterFeatureLookup=new Map();
    let filteredPoints=emptyCollection(),filteredTrack=emptyCollection(),filteredEvents=[],trackOverlays=[];
    let trackVisible=false,heatVisible=false,currentStyle='street',searchTerm='',mapReady=false;

    const coordinateKey=coordinates=>`${Number(coordinates[0]).toFixed(6)},${Number(coordinates[1]).toFixed(6)}`;

    function markerCoordinates(marker){const position=marker.getPosition();return position&&typeof position.getLng==='function'?[position.getLng(),position.getLat()]:position}

    function createVehicleCluster(A,vehicle,index){
      const pixelShift=index===0?-4:4;
      const cluster=new A.MarkerCluster(map,[],{
        gridSize:54,maxZoom:15,averageCenter:true,clusterByZoomChange:true,
        renderClusterMarker:context=>{const size=context.count<10?34:context.count<100?42:50,button=document.createElement('button');button.type='button';button.className='amap-cluster-marker';button.style.setProperty('--marker-color',vehicle.color);button.style.width=`${size}px`;button.style.height=`${size}px`;button.style.fontSize=`${context.count>99?12:13}px`;button.setAttribute('aria-label',`${vehicle.short_label||vehicle.label}聚合卡口 ${context.count} 个`);button.textContent=String(context.count);context.marker.setContent(button);context.marker.setOffset(new A.Pixel(-size/2+pixelShift,-size/2))},
        renderMarker:context=>{const coordinates=markerCoordinates(context.marker),feature=coordinates?clusterFeatureLookup.get(`${vehicle.id}|${coordinateKey(coordinates)}`):null,approximate=feature?.properties.geocode_quality==='road_or_area_approximate',button=document.createElement('button');button.type='button';button.className='amap-camera-marker';button.style.setProperty('--marker-color',vehicle.color);button.style.setProperty('--marker-stroke',approximate?'#94a3b8':'#fff');button.style.setProperty('--marker-stroke-width',`${approximate?4:2}px`);button.setAttribute('aria-label',feature?`${vehicle.short_label||vehicle.label}卡口点：${feature.properties.location}`:`${vehicle.short_label||vehicle.label}卡口点`);context.marker.setContent(button);context.marker.setOffset(new A.Pixel(-9+pixelShift,-9))}
      });
      cluster.on('click',event=>{const members=Array.isArray(event.clusterData)?event.clusterData:[],index=Number(members[0]?.featureIndex),feature=filteredPoints.features.find(item=>Number(item.properties._source_index)===index)||featureByIndex.get(index);if(members.length===1&&feature){window.setTimeout(()=>showPopup(feature),0);return}const position=event.lnglat&&typeof event.lnglat.getLng==='function'?[event.lnglat.getLng(),event.lnglat.getLat()]:event.lnglat;if(position)map.setZoomAndCenter(Math.min(map.getZoom()+2,17),position)});
      return cluster;
    }

    function addKeyLocationMarkers(){
      KEY_LOCATIONS.forEach(point=>{
        const content=`<button type="button" class="key-location-marker label-${point.labelSide}" aria-label="重点常去点位：${esc(point.name)}"><span class="key-flag">⚑</span><span class="key-label">${esc(point.name)}</span></button>`;
        const marker=new AMapLib.Marker({position:point.coordinates,content,anchor:'bottom-center',zIndex:320});
        marker.on('click',()=>openKeyInfo(point));map.add(marker);
      });
    }

    function openKeyInfo(point){const html=`<div class="custom-info"><button class="close" onclick="window.__closeAmapInfo()">×</button><h3>${esc(point.name)}</h3><table><tr><td>标记类型</td><td><b style="color:#fb7185">重点常去点位</b></td></tr><tr><td>说明</td><td>${esc(point.detail)}</td></tr><tr><td>定位依据</td><td>${esc(point.locationNote)}</td></tr><tr><td>GCJ-02</td><td>${point.coordinates[0].toFixed(6)}, ${point.coordinates[1].toFixed(6)}</td></tr></table></div>`;infoWindow.setContent(html);infoWindow.open(map,point.coordinates)}
    window.__closeAmapInfo=()=>infoWindow?.close();

    function buildTrack(events){
      const daily=new Map();events.forEach(event=>{const key=`${event.vehicleId}|${event.date}`;if(!daily.has(key))daily.set(key,[]);daily.get(key).push(event)});
      const features=[];daily.forEach((dayEvents,key)=>{const [vehicleId,date]=key.split('|'),coordinates=[];dayEvents.forEach(event=>{const previous=coordinates[coordinates.length-1];if(!previous||previous[0]!==event.coordinates[0]||previous[1]!==event.coordinates[1])coordinates.push(event.coordinates)});if(coordinates.length>1)features.push({type:'Feature',geometry:{type:'LineString',coordinates},properties:{vehicle_id:vehicleId,vehicle_label:vehicleById.get(vehicleId)?.label||vehicleId,date,event_count:dayEvents.length}})});return {type:'FeatureCollection',features};
    }

    function applyDateFilter({fit=false}={}){
      const start=startInput.value,end=endInput.value,status=document.getElementById('filterStatus');status.classList.remove('error');
      if(!start||!end||start>end){status.textContent='请选择有效日期区间，且开始日期不能晚于结束日期。';status.classList.add('error');return}
      const selectedVehicles=selectedVehicleIds(),lower=`${start} 00:00:00`,upper=`${end} 23:59:59`;
      filteredEvents=allEvents.filter(event=>selectedVehicles.has(event.vehicleId)&&event.time>=lower&&event.time<=upper);
      const timesByFeature=new Map();filteredEvents.forEach(event=>{if(!timesByFeature.has(event.sourceIndex))timesByFeature.set(event.sourceIndex,[]);timesByFeature.get(event.sourceIndex).push(event.time)});
      const features=[];timesByFeature.forEach((times,index)=>{const source=sourceFeatures[index],sorted=[...times].sort((a,b)=>a.localeCompare(b));features.push({...source,properties:{...source.properties,hit_count:sorted.length,first_seen:sorted[0],last_seen:sorted[sorted.length-1],event_times:[...sorted].reverse()}})});
      features.sort((a,b)=>b.properties.hit_count-a.properties.hit_count||b.properties.last_seen.localeCompare(a.properties.last_seen));filteredPoints={type:'FeatureCollection',features};filteredTrack=buildTrack(filteredEvents);
      updateSummary(start,end);renderList(searchTerm);if(mapReady){updateMapLayers();if(fit)fitFiltered()}
    }

    function updateSummary(start,end){
      const activeDates=new Set(filteredEvents.map(event=>event.date)),approximateCount=filteredPoints.features.filter(feature=>feature.properties.geocode_quality==='road_or_area_approximate').length;
      document.getElementById('records').textContent=filteredEvents.length.toLocaleString();document.getElementById('points').textContent=filteredPoints.features.length.toLocaleString();document.getElementById('activeDays').textContent=activeDates.size.toLocaleString();document.getElementById('approximate').textContent=approximateCount.toLocaleString();
      const selectedLabels=vehicles.filter(vehicle=>selectedVehicleIds().has(vehicle.id)).map(vehicle=>vehicle.short_label||vehicle.label);document.getElementById('period').textContent=`${selectedLabels.join('、')||'未选择车辆'} · ${start} — ${end}`;document.getElementById('filterStatus').textContent=filteredEvents.length?`已显示 ${selectedLabels.length} 辆车、${filteredEvents.length.toLocaleString()} 条记录，${filteredTrack.features.length} 个按日时序线段。`:'当前车辆与日期组合没有记录。';document.getElementById('trackBtn').textContent=`所选时段时序线　${trackVisible?'开':'关'} · ${filteredTrack.features.length}段`;
    }

    function updateMapLayers(){
      clusterFeatureLookup.clear();filteredPoints.features.forEach(feature=>clusterFeatureLookup.set(`${feature.properties.vehicle_id}|${coordinateKey(feature.geometry.coordinates)}`,feature));vehicles.forEach(vehicle=>vehicleClusters.get(vehicle.id)?.setData(filteredPoints.features.filter(feature=>feature.properties.vehicle_id===vehicle.id).map(feature=>({lnglat:feature.geometry.coordinates,weight:Number(feature.properties.hit_count)||1,featureIndex:Number(feature.properties._source_index)}))));
      const heatData=filteredPoints.features.map(feature=>({lng:feature.geometry.coordinates[0],lat:feature.geometry.coordinates[1],count:Number(feature.properties.hit_count)||1})),max=Math.max(1,...heatData.map(item=>item.count));heatMap.setDataSet({data:heatData,max});heatVisible?heatMap.show():heatMap.hide();
      if(trackOverlays.length)map.remove(trackOverlays);trackOverlays=filteredTrack.features.map(feature=>new AMapLib.Polyline({path:feature.geometry.coordinates,strokeColor:vehicleById.get(feature.properties.vehicle_id)?.color||'#60a5fa',strokeWeight:3,strokeOpacity:.78,strokeStyle:'solid',zIndex:110,showDir:false}));if(trackVisible&&trackOverlays.length)map.add(trackOverlays);
    }

    function showPopup(feature){
      const properties=feature.properties,times=asArray(properties.event_times),qualityLabel={intersection_verified:'双道路命中',poi_or_address:'POI/门牌命中',road_or_area_approximate:'道路级近似'}[properties.geocode_quality]||properties.geocode_quality,plates=asArray(properties.plate_numbers);
      const html=`<div class="custom-info"><button class="close" onclick="window.__closeAmapInfo()">×</button><h3>${esc(properties.location)}</h3><table><tr><td>车辆</td><td><b style="color:${esc(properties.vehicle_color)}">${esc(properties.vehicle_label)}</b><br>${plates.map(esc).join('、')}</td></tr><tr><td>卡口编号</td><td>${esc(properties.camera_code||'—')}</td></tr><tr><td>所选时段</td><td><b>${properties.hit_count}</b> 次</td></tr><tr><td>解析质量</td><td>${esc(qualityLabel)}</td></tr><tr><td>时间范围</td><td>${esc(properties.first_seen)}<br>${esc(properties.last_seen)}</td></tr><tr><td>GCJ-02</td><td>${Number(properties.gcj02_lng).toFixed(6)}, ${Number(properties.gcj02_lat).toFixed(6)}</td></tr></table><div class="times">${times.map(time=>esc(time)).join('<br>')}</div></div>`;
      infoWindow.setContent(html);infoWindow.open(map,feature.geometry.coordinates);
    }

    function fitFiltered(){
      const features=filteredPoints.features;if(!mapReady||!features.length)return;let minLng=Infinity,minLat=Infinity,maxLng=-Infinity,maxLat=-Infinity;features.forEach(feature=>{const [lng,lat]=feature.geometry.coordinates;minLng=Math.min(minLng,lng);minLat=Math.min(minLat,lat);maxLng=Math.max(maxLng,lng);maxLat=Math.max(maxLat,lat)});map.setBounds(new AMapLib.Bounds([minLng,minLat],[maxLng,maxLat]),false,[65,65,65,65],14);
    }

    function renderList(term=''){
      searchTerm=term.trim().toLowerCase();const items=filteredPoints.features.filter(feature=>{const properties=feature.properties;return !searchTerm||`${properties.location} ${properties.camera_code||''} ${properties.query_used||''} ${properties.vehicle_label||''} ${asArray(properties.plate_numbers).join(' ')}`.toLowerCase().includes(searchTerm)}).slice(0,100),list=document.getElementById('pointList');
      list.innerHTML=items.map((feature,index)=>{const properties=feature.properties;return `<div class="point" style="--vehicle-color:${properties.vehicle_color}" data-source-index="${properties._source_index}"><div class="rank">${index+1}</div><div><div class="point-name">${esc(properties.location)}</div><div class="point-vehicle">${esc(properties.vehicle_short_label||properties.vehicle_label)}</div><div class="point-time">${esc(properties.last_seen)}</div></div><div class="count">${properties.hit_count}</div></div>`}).join('')||'<div class="empty">没有匹配点位</div>';
      list.querySelectorAll('.point').forEach(element=>element.onclick=()=>{const feature=filteredPoints.features.find(item=>Number(item.properties._source_index)===Number(element.dataset.sourceIndex));if(!feature||!mapReady)return;map.setZoomAndCenter(16.2,feature.geometry.coordinates);showPopup(feature);if(innerWidth<=820)document.getElementById('sidebar').classList.remove('open')});
    }

    function setStyle(name){if(!mapReady||name===currentStyle)return;currentStyle=name;streetLayers.forEach(layer=>name==='street'?layer.show():layer.hide());satelliteLayers.forEach(layer=>name==='satellite'?layer.show():layer.hide());document.getElementById('streetBtn').classList.toggle('active',name==='street');document.getElementById('satelliteBtn').classList.toggle('active',name==='satellite')}

    async function initMap(A){
      AMapLib=A;streetLayers=[A.createDefaultLayer({zooms:[3,20],visible:true,opacity:1,zIndex:0})];satelliteLayers=[new A.TileLayer.Satellite({zooms:[3,20],visible:false,opacity:1,zIndex:0}),new A.TileLayer.RoadNet({zooms:[3,20],visible:false,opacity:1,zIndex:1})];map=new A.Map('map',{zoom:10.4,center:[121.30,31.38],viewMode:'2D',mapStyle:'amap://styles/normal',layers:[...streetLayers,...satelliteLayers]});satelliteLayers.forEach(layer=>layer.hide());map.addControl(new A.ToolBar({position:{right:'18px',bottom:'98px'}}));map.addControl(new A.Scale());infoWindow=new A.InfoWindow({isCustom:true,offset:new A.Pixel(0,-14),closeWhenClickMap:true});
      vehicles.forEach((vehicle,index)=>vehicleClusters.set(vehicle.id,createVehicleCluster(A,vehicle,index)));
      heatMap=new A.HeatMap(map,{radius:28,opacity:[0,.82],gradient:{.2:'#2dd4bf',.48:'#60a5fa',.72:'#fbbf24',1:'#fb7185'},zooms:[3,20]});heatMap.hide();addKeyLocationMarkers();mapReady=true;applyDateFilter();fitFiltered();loading.textContent='高德底图与静态点位已加载';window.setTimeout(()=>loading.style.display='none',1600);
    }

    document.getElementById('applyDate').onclick=()=>applyDateFilter({fit:true});document.getElementById('resetDate').onclick=()=>{startInput.value=minDate;endInput.value=maxDate;applyDateFilter({fit:true})};[startInput,endInput].forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter')applyDateFilter({fit:true})}));vehicleChoices.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>applyDateFilter({fit:true})));document.getElementById('search').oninput=event=>renderList(event.target.value);document.getElementById('streetBtn').onclick=()=>setStyle('street');document.getElementById('satelliteBtn').onclick=()=>setStyle('satellite');document.getElementById('fitBtn').onclick=fitFiltered;document.getElementById('mobileToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('trackBtn').onclick=event=>{trackVisible=!trackVisible;if(mapReady){trackVisible?map.add(trackOverlays):map.remove(trackOverlays)}event.currentTarget.classList.toggle('active',trackVisible);event.currentTarget.textContent=`所选时段时序线　${trackVisible?'开':'关'} · ${filteredTrack.features.length}段`};document.getElementById('heatBtn').onclick=event=>{heatVisible=!heatVisible;if(mapReady)(heatVisible?heatMap.show():heatMap.hide());event.currentTarget.classList.toggle('active',heatVisible);event.currentTarget.textContent=`热力视图　${heatVisible?'开':'关'}`};

    applyDateFilter();window._AMapSecurityConfig={securityJsCode:CONFIG.securityJsCode};const loader=document.createElement('script');loader.src='https://webapi.amap.com/loader.js';loader.onload=()=>AMapLoader.load({key:CONFIG.jsKey,version:'2.0',plugins:['AMap.ToolBar','AMap.Scale','AMap.MarkerCluster','AMap.HeatMap']}).then(initMap).catch(error=>showError(`高德 JS API 加载失败：${error?.message||error}`));loader.onerror=()=>showError('无法加载高德 JS API Loader。');document.head.appendChild(loader);
  </script>
</body>
</html>
