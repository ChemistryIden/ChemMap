<!doctype html>
<html lang="zh-CN">
<head>

  <style>
    :root{--navy:#0a1423;--panel:#0f1d2e;--panel2:#14243a;--line:#263b55;--ink:#ecf4fb;--muted:#8fa4b9;--cyan:#2dd4bf;--blue:#60a5fa;--amber:#fbbf24;--red:#fb7185;--purple:#a78bfa}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input{font:inherit}.app{position:fixed;inset:0;display:grid;grid-template-columns:380px 1fr}.sidebar{display:flex;flex-direction:column;min-height:0;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#0c1929,#0a1423);border-right:1px solid var(--line);z-index:2}
    .head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}.head h1{font-size:20px;line-height:1.35;margin:7px 0 6px}.muted{color:var(--muted)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}.stat{background:rgba(20,36,58,.72);border:1px solid var(--line);border-radius:10px;padding:9px 10px}.stat b{display:block;font-size:19px;color:#fff}.stat span{font-size:11px;color:var(--muted)}
    .date-filter{margin:0 16px 12px;padding:12px;background:rgba(20,36,58,.55);border:1px solid var(--line);border-radius:11px}.filter-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.filter-head b{font-size:13px}.filter-head span{font-size:11px;color:var(--muted)}
    .date-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.date-grid label{display:block;color:var(--muted);font-size:11px}.date-grid input{display:block;width:100%;margin-top:4px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#0a1727;color:var(--ink);color-scheme:dark;outline:none}.date-grid input:focus{border-color:var(--blue)}
    .filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.filter-actions button,.tools button,.search{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 10px}.filter-actions button{cursor:pointer}.filter-actions .primary{border-color:#168878;background:#123831;color:#89f3e1}.filter-status{min-height:18px;margin-top:7px;color:var(--muted);font-size:11px}.filter-status.error{color:var(--red)}
    .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}.tools button{cursor:pointer;text-align:left}.tools button.active{border-color:var(--cyan);color:var(--cyan);background:#102d34}.tools .route{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}.tools .route small{color:var(--muted);font-size:10px;text-align:right}.route-note{margin:0 16px 11px;padding:9px 10px;border-left:3px solid var(--purple);border-radius:0 8px 8px 0;background:rgba(167,139,250,.08);font-size:11px;color:#d9cdfc}.route-note span{display:block;margin-top:3px;color:var(--muted)}
    .search-wrap{padding:0 16px 10px}.search{width:100%;outline:none}.search:focus{border-color:var(--blue)}.list-head{display:flex;justify-content:space-between;padding:0 18px 7px;color:var(--muted);font-size:12px}.point-list{overflow:auto;padding:0 8px 18px}.point{display:grid;grid-template-columns:34px 1fr 42px;gap:9px;align-items:center;padding:9px;border-radius:9px;cursor:pointer;border:1px solid transparent}.point:hover{background:var(--panel2);border-color:var(--line)}
    .point-list{flex:none;min-height:120px;overflow:visible}.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#17314a;color:var(--blue);font-weight:700}.point-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.point-time{font-size:11px;color:var(--muted)}.count{text-align:right;color:var(--amber);font-weight:700}
    .map-wrap,#map{position:relative;width:100%;height:100%}.floating{position:absolute;z-index:1;top:16px;right:16px;display:flex;gap:8px}.floating button{border:1px solid rgba(255,255,255,.25);background:rgba(9,18,31,.84);backdrop-filter:blur(10px);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.floating button.active{background:#fff;color:#0b1725}
    .legend{position:absolute;z-index:1;left:16px;bottom:28px;max-width:350px;background:rgba(9,18,31,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;color:#d8e4ef;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.legend div+div{margin-top:5px}.legend .line{width:16px;height:3px;border-radius:2px;vertical-align:middle}
    .mapboxgl-popup-content{background:#0f1d2e;color:#ecf4fb;border:1px solid #34506d;border-radius:12px;padding:14px;min-width:280px;box-shadow:0 16px 45px rgba(0,0,0,.4)}.mapboxgl-popup-tip{border-top-color:#0f1d2e!important;border-bottom-color:#0f1d2e!important}.popup h3{font-size:15px;margin:0 0 8px}.popup table{width:100%;border-collapse:collapse;font-size:12px}.popup td{padding:4px 0;border-top:1px solid #263b55;vertical-align:top}.popup td:first-child{color:#8fa4b9;width:76px}.times{max-height:118px;overflow:auto;margin-top:7px;color:#b9cad9;font-size:11px}.empty{padding:28px;color:var(--muted);text-align:center}
    @media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:3;width:min(92vw,380px);height:100%;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.mobile-toggle{display:block!important}.legend{left:auto;right:12px;bottom:22px;max-width:280px}.floating{right:12px;top:12px}.floating button{padding:8px 10px}}.mobile-toggle{display:none}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="head"><div class="eyebrow">Recent camera sightings · WGS84</div><h1>孙振团伙关联车辆<br>近期卡口点位图</h1><div class="muted" id="period">加载数据…</div></div>
      <div class="stats"><div class="stat"><b id="records">—</b><span>所选过车记录</span></div><div class="stat"><b id="points">—</b><span>所选卡口点位</span></div><div class="stat"><b id="activeDays">—</b><span>有记录日期</span></div><div class="stat"><b id="approximate">—</b><span>道路级近似点</span></div></div>
      <section class="date-filter" aria-label="日期筛选"><div class="filter-head"><b>日期区间</b><span>默认全部时间</span></div><div class="date-grid"><label>开始日期<input id="startDate" type="date"></label><label>结束日期<input id="endDate" type="date"></label></div><div class="filter-actions"><button id="applyDate" class="primary">应用筛选</button><button id="resetDate">恢复全部</button></div><div id="filterStatus" class="filter-status"></div></section>
      <div class="tools"><button id="trackBtn">所选时段时序线　关</button><button id="heatBtn">热力视图　关</button><button id="tdtRouteBtn" class="route active"><span>候选据点三点路径　开</span><small id="tdtRouteMeta">天地图预计算 · 1.02 km · 89 秒</small></button></div>
      <div class="route-note">励学路—丰登路卡口 → 励学路1111号 → 励学路368号卡口<span id="routeNearby">正在计算所选时段沿线记录…</span><span>天地图路径已静态保存，访问页面时不调用天地图 API。</span></div>
      <div class="search-wrap"><input id="search" class="search" placeholder="搜索路口、道路或卡口编号"></div><div class="list-head"><span>所选时段高频点位</span><span>次数</span></div><div id="pointList" class="point-list"></div>
    </aside>
    <main class="map-wrap"><div id="map"></div><div class="floating"><button id="mobileToggle" class="mobile-toggle">点位</button><button id="fitBtn">筛选全览</button><button id="streetBtn" class="active">街道</button><button id="satelliteBtn">卫星</button></div><div class="legend"><div><i style="background:#2dd4bf"></i>路口/POI核验点</div><div><i style="background:#fbbf24"></i>百度道路级近似点</div><div><i class="line" style="background:#a78bfa"></i>天地图预计算候选据点驾车路径</div><div><i class="line" style="background:#fb7185"></i>所选时段按日分段的卡口先后线（非真实轨迹）</div></div></main>
  </div>
  <script>
    const DATA=window.TRAFFIC_MAP_DATA,CONFIG=window.MAP_RUNTIME_CONFIG;
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const asArray=value=>Array.isArray(value)?value:(typeof value==='string'?JSON.parse(value||'[]'):[]);
    const emptyCollection=()=>({type:'FeatureCollection',features:[]});
    const TDT_ROUTE={metadata:{provider:'天地图驾车规划 Web API',distance_km:1.02,duration_seconds:89,coordinate_system:'CGCS2000/WGS84近似',generated_at:'2026-07-29'},line:{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'LineString',coordinates:[[121.2979793292287,31.365433795339065],[121.29803,31.36538],[121.29845,31.36465],[121.29908,31.36355],[121.29868,31.36332],[121.29952,31.3628],[121.29963,31.3627],[121.30041,31.36135],[121.30093,31.36043],[121.30128,31.35981],[121.30282,31.35718],[121.30266,31.35709]]},properties:{provider:'天地图',distance_km:1.02,duration_seconds:89}}]},points:{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Point',coordinates:[121.2979793292287,31.365433795339065]},properties:{order:1,label:'励学路—丰登路卡口',role:'起点'}},{type:'Feature',geometry:{type:'Point',coordinates:[121.2986828290549,31.363326354318957]},properties:{order:2,label:'励学路1111号',role:'候选据点'}},{type:'Feature',geometry:{type:'Point',coordinates:[121.3026691259162,31.357097227336773]},properties:{order:3,label:'励学路368号卡口',role:'终点'}}]}};
    if(!DATA||!CONFIG?.mapboxAccessToken){document.body.innerHTML='<div class="empty">地图数据或 Mapbox 配置尚未就绪。</div>';throw new Error('missing map data/config')}
    const meta=DATA.metadata;
    const sourceFeatures=DATA.points.features.map((feature,index)=>({...feature,properties:{...feature.properties,_source_index:index}}));
    const allEvents=sourceFeatures.flatMap(feature=>asArray(feature.properties.event_times).map(time=>({time,date:time.slice(0,10),coordinates:feature.geometry.coordinates,sourceIndex:feature.properties._source_index}))).sort((a,b)=>a.time.localeCompare(b.time));
    const minDate=meta.start_time.slice(0,10),maxDate=meta.end_time.slice(0,10);
    const startInput=document.getElementById('startDate'),endInput=document.getElementById('endDate');
    [startInput,endInput].forEach(input=>{input.min=minDate;input.max=maxDate});startInput.value=minDate;endInput.value=maxDate;
    let filteredPoints=emptyCollection(),filteredTrack=emptyCollection(),filteredEvents=[];let trackVisible=false,heatVisible=false,tdtRouteVisible=true,currentStyle='street',handlersBound=false;let searchTerm='';
    mapboxgl.accessToken=CONFIG.mapboxAccessToken;
    const styles={street:'mapbox://styles/mapbox/streets-v12',satellite:'mapbox://styles/mapbox/satellite-streets-v12'};
    const map=new mapboxgl.Map({container:'map',style:styles.street,center:[121.30,31.36],zoom:10.4,attributionControl:true});map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'bottom-right');map.addControl(new mapboxgl.ScaleControl({unit:'metric'}),'bottom-right');
    function buildTrack(events){const daily=new Map();events.forEach(event=>{if(!daily.has(event.date))daily.set(event.date,[]);daily.get(event.date).push(event)});const features=[];daily.forEach((dayEvents,date)=>{const coordinates=[];dayEvents.forEach(event=>{const previous=coordinates[coordinates.length-1];if(!previous||previous[0]!==event.coordinates[0]||previous[1]!==event.coordinates[1])coordinates.push(event.coordinates)});if(coordinates.length>1)features.push({type:'Feature',geometry:{type:'LineString',coordinates},properties:{date,event_count:dayEvents.length,label:'按采集时间排序的卡口连线（按日分段；不等同真实道路轨迹）'}})});return {type:'FeatureCollection',features}}
    function distanceToSegmentMeters(point,a,b){const lat0=point[1]*Math.PI/180,scaleX=111320*Math.cos(lat0),scaleY=110540;const px=(point[0]-a[0])*scaleX,py=(point[1]-a[1])*scaleY,bx=(b[0]-a[0])*scaleX,by=(b[1]-a[1])*scaleY;const len2=bx*bx+by*by,t=len2?Math.max(0,Math.min(1,(px*bx+py*by)/len2)):0;return Math.hypot(px-t*bx,py-t*by)}
    function distanceToRouteMeters(point){const line=TDT_ROUTE.line.features[0].geometry.coordinates;let minimum=Infinity;for(let i=1;i<line.length;i++)minimum=Math.min(minimum,distanceToSegmentMeters(point,line[i-1],line[i]));return minimum}
    function applyDateFilter({fit=false}={}){const start=startInput.value,end=endInput.value,status=document.getElementById('filterStatus');status.classList.remove('error');if(!start||!end||start>end){status.textContent='请选择有效日期区间，且开始日期不能晚于结束日期。';status.classList.add('error');return}const lower=`${start} 00:00:00`,upper=`${end} 23:59:59`;filteredEvents=allEvents.filter(event=>event.time>=lower&&event.time<=upper);const timesByFeature=new Map();filteredEvents.forEach(event=>{if(!timesByFeature.has(event.sourceIndex))timesByFeature.set(event.sourceIndex,[]);timesByFeature.get(event.sourceIndex).push(event.time)});const features=[];timesByFeature.forEach((times,index)=>{const source=sourceFeatures[index],sorted=[...times].sort((a,b)=>a.localeCompare(b)),nearRoute=distanceToRouteMeters(source.geometry.coordinates)<=250;features.push({...source,properties:{...source.properties,hit_count:sorted.length,first_seen:sorted[0],last_seen:sorted[sorted.length-1],event_times:[...sorted].reverse(),near_tdt_route:nearRoute?1:0}})});features.sort((a,b)=>b.properties.hit_count-a.properties.hit_count||b.properties.last_seen.localeCompare(a.properties.last_seen));filteredPoints={type:'FeatureCollection',features};filteredTrack=buildTrack(filteredEvents);updateSummary(start,end);renderList(searchTerm);if(map.getSource('camera-points'))map.getSource('camera-points').setData(filteredPoints);if(map.getSource('track'))map.getSource('track').setData(filteredTrack);if(fit)fitFiltered()}
    function updateSummary(start,end){const activeDates=new Set(filteredEvents.map(event=>event.date));const approximateCount=filteredPoints.features.filter(feature=>feature.properties.geocode_quality==='road_or_area_approximate').length;const nearbyFeatures=filteredPoints.features.filter(feature=>feature.properties.near_tdt_route===1),nearbyPasses=nearbyFeatures.reduce((sum,feature)=>sum+feature.properties.hit_count,0);document.getElementById('records').textContent=filteredEvents.length.toLocaleString();document.getElementById('points').textContent=filteredPoints.features.length.toLocaleString();document.getElementById('activeDays').textContent=activeDates.size.toLocaleString();document.getElementById('approximate').textContent=approximateCount.toLocaleString();document.getElementById('period').textContent=`${meta.plate_numbers.join('、')} · ${start} — ${end}`;document.getElementById('filterStatus').textContent=filteredEvents.length?`已显示 ${filteredEvents.length.toLocaleString()} 条记录，${filteredTrack.features.length} 个按日时序线段。`:'所选日期没有记录。';document.getElementById('routeNearby').textContent=`所选时段路径 250 米范围内：${nearbyPasses.toLocaleString()} 次过车，${nearbyFeatures.length} 个卡口。`;document.getElementById('trackBtn').textContent=`所选时段时序线　${trackVisible?'开':'关'} · ${filteredTrack.features.length}段`}
    function addLayers(){if(map.getSource('camera-points'))return;map.addSource('camera-points',{type:'geojson',data:filteredPoints,cluster:true,clusterMaxZoom:15,clusterRadius:46,clusterProperties:{passes_sum:['+',['get','hit_count']]}});map.addSource('track',{type:'geojson',data:filteredTrack});map.addSource('tdt-route',{type:'geojson',data:TDT_ROUTE.line});map.addSource('tdt-route-points',{type:'geojson',data:TDT_ROUTE.points});map.addLayer({id:'track-shadow',type:'line',source:'track',layout:{visibility:trackVisible?'visible':'none','line-join':'round','line-cap':'round'},paint:{'line-color':'#07101d','line-width':7,'line-opacity':.38}});map.addLayer({id:'track-line',type:'line',source:'track',layout:{visibility:trackVisible?'visible':'none','line-join':'round','line-cap':'round'},paint:{'line-color':'#fb7185','line-width':2.4,'line-opacity':.72}});map.addLayer({id:'tdt-route-shadow',type:'line',source:'tdt-route',layout:{visibility:tdtRouteVisible?'visible':'none','line-join':'round','line-cap':'round'},paint:{'line-color':'#07101d','line-width':9,'line-opacity':.62}});map.addLayer({id:'tdt-route-line',type:'line',source:'tdt-route',layout:{visibility:tdtRouteVisible?'visible':'none','line-join':'round','line-cap':'round'},paint:{'line-color':'#a78bfa','line-width':5,'line-opacity':.96}});map.addLayer({id:'camera-heat',type:'heatmap',source:'camera-points',maxzoom:15,layout:{visibility:heatVisible?'visible':'none'},paint:{'heatmap-weight':['interpolate',['linear'],['get','hit_count'],1,.12,42,1],'heatmap-intensity':['interpolate',['linear'],['zoom'],8,.7,14,2.4],'heatmap-color':['interpolate',['linear'],['heatmap-density'],0,'rgba(45,212,191,0)',.25,'#2dd4bf',.55,'#60a5fa',.78,'#fbbf24',1,'#fb7185'],'heatmap-radius':['interpolate',['linear'],['zoom'],8,14,14,34],'heatmap-opacity':.78}});map.addLayer({id:'route-nearby-halo',type:'circle',source:'camera-points',filter:['all',['!',['has','point_count']],['==',['get','near_tdt_route'],1]],layout:{visibility:tdtRouteVisible?'visible':'none'},paint:{'circle-color':'rgba(167,139,250,0)','circle-radius':['interpolate',['linear'],['zoom'],10,10,16,20],'circle-stroke-width':3,'circle-stroke-color':'#a78bfa','circle-opacity':.9}});map.addLayer({id:'clusters',type:'circle',source:'camera-points',filter:['has','point_count'],paint:{'circle-color':['step',['get','passes_sum'],'#2dd4bf',12,'#60a5fa',30,'#fbbf24',70,'#fb7185'],'circle-radius':['step',['get','passes_sum'],17,12,22,30,28,70,35],'circle-stroke-width':2,'circle-stroke-color':'rgba(255,255,255,.82)','circle-opacity':.9}});map.addLayer({id:'cluster-count',type:'symbol',source:'camera-points',filter:['has','point_count'],layout:{'text-field':['to-string',['get','passes_sum']],'text-size':12,'text-font':['DIN Offc Pro Medium','Arial Unicode MS Bold']},paint:{'text-color':'#07111f'}});map.addLayer({id:'camera-point',type:'circle',source:'camera-points',filter:['!',['has','point_count']],paint:{'circle-color':['match',['get','geocode_quality'],'road_or_area_approximate','#fbbf24','intersection_verified','#2dd4bf','poi_or_address','#60a5fa','#94a3b8'],'circle-radius':['interpolate',['linear'],['get','hit_count'],1,6,10,9,42,14],'circle-stroke-color':'#fff','circle-stroke-width':2,'circle-opacity':.94}});map.addLayer({id:'tdt-route-point',type:'circle',source:'tdt-route-points',layout:{visibility:tdtRouteVisible?'visible':'none'},paint:{'circle-color':['match',['get','role'],'候选据点','#fb7185','#a78bfa'],'circle-radius':9,'circle-stroke-width':3,'circle-stroke-color':'#fff'}});map.addLayer({id:'tdt-route-label',type:'symbol',source:'tdt-route-points',layout:{visibility:tdtRouteVisible?'visible':'none','text-field':['concat',['to-string',['get','order']],'. ',['get','label']],'text-size':12,'text-offset':[0,1.45],'text-anchor':'top','text-font':['DIN Offc Pro Medium','Arial Unicode MS Bold']},paint:{'text-color':'#fff','text-halo-color':'#111827','text-halo-width':1.6}});bindLayerHandlers()}
    function bindLayerHandlers(){if(handlersBound)return;handlersBound=true;map.on('click','clusters',event=>{const feature=event.features[0];map.getSource('camera-points').getClusterExpansionZoom(feature.properties.cluster_id,(error,zoom)=>{if(!error)map.easeTo({center:feature.geometry.coordinates,zoom})})});map.on('click','camera-point',event=>showPopup(event.features[0]));map.on('click','tdt-route-point',event=>{const properties=event.features[0].properties;new mapboxgl.Popup({offset:14}).setLngLat(event.features[0].geometry.coordinates).setHTML(`<div class="popup"><h3>${esc(properties.label)}</h3><div>${esc(properties.role)} · 天地图预计算驾车路径</div></div>`).addTo(map)});['clusters','camera-point','tdt-route-point'].forEach(id=>{map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='')})}
    function showPopup(feature){const properties=feature.properties,times=asArray(properties.event_times);const qualityLabel={intersection_verified:'双道路命中',poi_or_address:'POI/门牌命中',road_or_area_approximate:'道路级近似'}[properties.geocode_quality]||properties.geocode_quality;const html=`<div class="popup"><h3>${esc(properties.location)}</h3><table><tr><td>卡口编号</td><td>${esc(properties.camera_code||'—')}</td></tr><tr><td>所选时段</td><td><b>${properties.hit_count}</b> 次</td></tr><tr><td>解析质量</td><td>${esc(qualityLabel)}</td></tr><tr><td>百度返回</td><td>${esc(properties.baidu_poi_title||'—')}</td></tr><tr><td>时间范围</td><td>${esc(properties.first_seen)}<br>${esc(properties.last_seen)}</td></tr><tr><td>WGS84</td><td>${Number(properties.wgs84_lng).toFixed(6)}, ${Number(properties.wgs84_lat).toFixed(6)}</td></tr><tr><td>路径邻近</td><td>${Number(properties.near_tdt_route)===1?'距候选据点路径 250 米内':'不在 250 米范围内'}</td></tr></table><div class="times">${times.map(time=>esc(time)).join('<br>')}</div></div>`;new mapboxgl.Popup({offset:14,maxWidth:'390px'}).setLngLat(feature.geometry.coordinates).setHTML(html).addTo(map)}
    function fitFeatures(features,{maxZoom=13.7,padding=55}={}){const bounds=new mapboxgl.LngLatBounds();features.forEach(feature=>{const geometry=feature.geometry;if(geometry.type==='Point')bounds.extend(geometry.coordinates);else geometry.coordinates.forEach(coordinate=>bounds.extend(coordinate))});if(!bounds.isEmpty())map.fitBounds(bounds,{padding:{top:padding,bottom:padding,left:padding,right:padding},maxZoom,duration:900})}function fitFiltered(){fitFeatures(filteredPoints.features)}function fitRoute(){fitFeatures(TDT_ROUTE.points.features,{maxZoom:16.3,padding:90})}
    function renderList(term=''){searchTerm=term.trim().toLowerCase();const items=filteredPoints.features.filter(feature=>{const properties=feature.properties;return !searchTerm||`${properties.location} ${properties.camera_code||''} ${properties.query_used||''}`.toLowerCase().includes(searchTerm)}).slice(0,100);const list=document.getElementById('pointList');list.innerHTML=items.map((feature,index)=>{const properties=feature.properties;return `<div class="point" data-source-index="${properties._source_index}"><div class="rank">${index+1}</div><div><div class="point-name">${esc(properties.location)}</div><div class="point-time">${esc(properties.last_seen)}</div></div><div class="count">${properties.hit_count}</div></div>`}).join('')||'<div class="empty">没有匹配点位</div>';list.querySelectorAll('.point').forEach(element=>element.onclick=()=>{const sourceIndex=Number(element.dataset.sourceIndex),feature=filteredPoints.features.find(item=>Number(item.properties._source_index)===sourceIndex);if(!feature)return;map.flyTo({center:feature.geometry.coordinates,zoom:16.2});showPopup(feature);if(innerWidth<=820)document.getElementById('sidebar').classList.remove('open')})}
    function setStyle(name){if(name===currentStyle)return;currentStyle=name;map.setStyle(styles[name]);document.getElementById('streetBtn').classList.toggle('active',name==='street');document.getElementById('satelliteBtn').classList.toggle('active',name==='satellite')}
    document.getElementById('applyDate').onclick=()=>applyDateFilter({fit:true});document.getElementById('resetDate').onclick=()=>{startInput.value=minDate;endInput.value=maxDate;applyDateFilter({fit:true})};[startInput,endInput].forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter')applyDateFilter({fit:true})}));document.getElementById('search').oninput=event=>renderList(event.target.value);document.getElementById('streetBtn').onclick=()=>setStyle('street');document.getElementById('satelliteBtn').onclick=()=>setStyle('satellite');document.getElementById('fitBtn').onclick=fitFiltered;document.getElementById('mobileToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('trackBtn').onclick=event=>{trackVisible=!trackVisible;['track-line','track-shadow'].forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',trackVisible?'visible':'none'));event.currentTarget.classList.toggle('active',trackVisible);event.currentTarget.textContent=`所选时段时序线　${trackVisible?'开':'关'} · ${filteredTrack.features.length}段`};document.getElementById('heatBtn').onclick=event=>{heatVisible=!heatVisible;if(map.getLayer('camera-heat'))map.setLayoutProperty('camera-heat','visibility',heatVisible?'visible':'none');event.currentTarget.classList.toggle('active',heatVisible);event.currentTarget.textContent=`热力视图　${heatVisible?'开':'关'}`};document.getElementById('tdtRouteBtn').onclick=event=>{tdtRouteVisible=!tdtRouteVisible;['tdt-route-shadow','tdt-route-line','tdt-route-point','tdt-route-label','route-nearby-halo'].forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',tdtRouteVisible?'visible':'none'));event.currentTarget.classList.toggle('active',tdtRouteVisible);event.currentTarget.querySelector('span').textContent=`候选据点三点路径　${tdtRouteVisible?'开':'关'}`;if(tdtRouteVisible)fitRoute()};
    applyDateFilter();map.on('load',()=>{addLayers();fitFiltered()});map.on('style.load',()=>addLayers());
  </script>
</body>
