<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>孙振团伙关联车辆近期卡口地图</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>
<script src="runtime-config.js"></script><script src="map_data.js"></script>
<style>
:root{--navy:#0a1423;--panel:#0f1d2e;--panel2:#14243a;--line:#263b55;--ink:#ecf4fb;--muted:#8fa4b9;--cyan:#2dd4bf;--blue:#60a5fa;--amber:#fbbf24;--red:#fb7185}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--navy);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.app{display:grid;grid-template-columns:360px 1fr;height:100%}.sidebar{display:flex;flex-direction:column;min-height:0;background:linear-gradient(180deg,#0c1929,#0a1423);border-right:1px solid var(--line);z-index:2}
.head{padding:22px 22px 16px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}.head h1{font-size:20px;line-height:1.35;margin:7px 0 6px}.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px}.stat{background:rgba(20,36,58,.72);border:1px solid var(--line);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px;color:#fff}.stat span{font-size:11px;color:var(--muted)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 12px}.tools button,.search{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px 10px}.tools button{cursor:pointer;text-align:left}.tools button.active{border-color:var(--cyan);color:var(--cyan);background:#102d34}
.search-wrap{padding:0 18px 12px}.search{width:100%;outline:none}.search:focus{border-color:var(--blue)}
.list-head{display:flex;justify-content:space-between;padding:0 20px 7px;color:var(--muted);font-size:12px}.point-list{overflow:auto;padding:0 10px 18px}.point{display:grid;grid-template-columns:34px 1fr 42px;gap:9px;align-items:center;padding:10px;border-radius:9px;cursor:pointer;border:1px solid transparent}.point:hover{background:var(--panel2);border-color:var(--line)}
.rank{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#17314a;color:var(--blue);font-weight:700}.point-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.point-time{font-size:11px;color:var(--muted)}.count{text-align:right;color:var(--amber);font-weight:700}
.map-wrap,#map{position:relative;width:100%;height:100%}.floating{position:absolute;z-index:1;top:16px;right:16px;display:flex;gap:8px}.floating button{border:1px solid rgba(255,255,255,.25);background:rgba(9,18,31,.84);backdrop-filter:blur(10px);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.floating button.active{background:#fff;color:#0b1725}
.legend{position:absolute;z-index:1;left:16px;bottom:28px;background:rgba(9,18,31,.88);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;color:#d8e4ef;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.legend div+div{margin-top:5px}
.mapboxgl-popup-content{background:#0f1d2e;color:#ecf4fb;border:1px solid #34506d;border-radius:12px;padding:14px;min-width:280px;box-shadow:0 16px 45px rgba(0,0,0,.4)}.mapboxgl-popup-tip{border-top-color:#0f1d2e!important;border-bottom-color:#0f1d2e!important}.popup h3{font-size:15px;margin:0 0 8px}.popup table{width:100%;border-collapse:collapse;font-size:12px}.popup td{padding:4px 0;border-top:1px solid #263b55;vertical-align:top}.popup td:first-child{color:#8fa4b9;width:68px}.times{max-height:118px;overflow:auto;margin-top:7px;color:#b9cad9;font-size:11px}
.empty{padding:28px;color:var(--muted);text-align:center}
@media(max-width:820px){.app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:3;width:min(88vw,350px);height:100%;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.mobile-toggle{display:block!important}.legend{left:auto;right:12px;bottom:22px}.floating{right:12px;top:12px}.floating button{padding:8px 10px}}.mobile-toggle{display:none}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="head"><div class="eyebrow">Recent camera sightings · WGS84</div><h1>孙振团伙关联车辆<br>近期卡口点位图</h1><div class="muted" id="period">加载数据…</div></div>
<div class="stats"><div class="stat"><b id="records">—</b><span>过车记录</span></div><div class="stat"><b id="points">—</b><span>已落图卡口</span></div><div class="stat"><b id="coverage">—</b><span>记录坐标覆盖</span></div><div class="stat"><b id="approximate">—</b><span>道路级近似</span></div></div>
<div class="tools"><button id="trackBtn">轨迹连线　关</button><button id="heatBtn">热力视图　关</button></div>
<div class="search-wrap"><input id="search" class="search" placeholder="搜索路口、道路或卡口编号"></div><div class="list-head"><span>高频点位</span><span>次数</span></div><div id="pointList" class="point-list"></div></aside>
<main class="map-wrap"><div id="map"></div><div class="floating"><button id="mobileToggle" class="mobile-toggle">点位</button><button id="fitBtn">全览</button><button id="streetBtn" class="active">街道</button><button id="satelliteBtn">卫星</button></div>
<div class="legend"><div><i style="background:#2dd4bf"></i>路口/POI核验点</div><div><i style="background:#fbbf24"></i>百度道路级近似点</div><div><i style="background:#fb7185"></i>按时间先后直线连接，仅供时序浏览</div></div></main></div>
<script>
const DATA=window.TRAFFIC_MAP_DATA,CONFIG=window.MAP_RUNTIME_CONFIG;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(!DATA||!CONFIG?.mapboxAccessToken){document.body.innerHTML='<div class="empty">地图数据或 Mapbox 配置尚未就绪。</div>';throw new Error("missing map data/config")}
const meta=DATA.metadata;
document.getElementById('records').textContent=meta.record_count.toLocaleString();
document.getElementById('points').textContent=meta.resolved_camera_location_count.toLocaleString();
document.getElementById('approximate').textContent=meta.approximate_camera_location_count.toLocaleString();
document.getElementById('coverage').textContent=(meta.resolved_event_count/meta.record_count*100).toFixed(1)+'%';
document.getElementById('period').textContent=`${meta.plate_numbers.join('、')} · ${meta.start_time} — ${meta.end_time}`;
mapboxgl.accessToken=CONFIG.mapboxAccessToken;
const styles={street:'mapbox://styles/mapbox/streets-v12',satellite:'mapbox://styles/mapbox/satellite-streets-v12'};
const map=new mapboxgl.Map({container:'map',style:styles.street,center:[121.30,31.36],zoom:10.4,attributionControl:true});
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'bottom-right');map.addControl(new mapboxgl.ScaleControl({unit:'metric'}),'bottom-right');
let trackVisible=false,heatVisible=false,currentStyle='street',handlersBound=false;
function addLayers(){
  if(map.getSource('camera-points')) return;
  map.addSource('camera-points',{type:'geojson',data:DATA.points,cluster:true,clusterMaxZoom:15,clusterRadius:46,clusterProperties:{passes_sum:['+',['get','hit_count']]}});
  map.addSource('track',{type:'geojson',data:DATA.track});
  map.addLayer({id:'track-shadow',type:'line',source:'track',layout:{visibility:trackVisible?'visible':'none','line-join':'round','line-cap':'round'},paint:{'line-color':'#07101d','line-width':7,'line-opacity':.38}});
  map.addLayer({id:'track-line',type:'line',source:'track',layout:{visibility:trackVisible?'visible':'none','line-join':'round','line-cap':'round'},paint:{'line-color':'#fb7185','line-width':2.4,'line-opacity':.72}});
  map.addLayer({id:'camera-heat',type:'heatmap',source:'camera-points',maxzoom:15,layout:{visibility:heatVisible?'visible':'none'},paint:{'heatmap-weight':['interpolate',['linear'],['get','hit_count'],1,.12,42,1],'heatmap-intensity':['interpolate',['linear'],['zoom'],8,.7,14,2.4],'heatmap-color':['interpolate',['linear'],['heatmap-density'],0,'rgba(45,212,191,0)',.25,'#2dd4bf',.55,'#60a5fa',.78,'#fbbf24',1,'#fb7185'],'heatmap-radius':['interpolate',['linear'],['zoom'],8,14,14,34],'heatmap-opacity':.78}});
  map.addLayer({id:'clusters',type:'circle',source:'camera-points',filter:['has','point_count'],paint:{'circle-color':['step',['get','passes_sum'],'#2dd4bf',12,'#60a5fa',30,'#fbbf24',70,'#fb7185'],'circle-radius':['step',['get','passes_sum'],17,12,22,30,28,70,35],'circle-stroke-width':2,'circle-stroke-color':'rgba(255,255,255,.82)','circle-opacity':.9}});
  map.addLayer({id:'cluster-count',type:'symbol',source:'camera-points',filter:['has','point_count'],layout:{'text-field':['to-string',['get','passes_sum']],'text-size':12,'text-font':['DIN Offc Pro Medium','Arial Unicode MS Bold']},paint:{'text-color':'#07111f'}});
  map.addLayer({id:'camera-point',type:'circle',source:'camera-points',filter:['!',['has','point_count']],paint:{'circle-color':['match',['get','geocode_quality'],'road_or_area_approximate','#fbbf24','intersection_verified','#2dd4bf','poi_or_address','#60a5fa','#94a3b8'],'circle-radius':['interpolate',['linear'],['get','hit_count'],1,6,10,9,42,14],'circle-stroke-color':'#fff','circle-stroke-width':2,'circle-opacity':.94}});
  bindLayerHandlers();
}
function bindLayerHandlers(){if(handlersBound)return;handlersBound=true;
  map.on('click','clusters',e=>{const f=e.features[0];map.getSource('camera-points').getClusterExpansionZoom(f.properties.cluster_id,(err,zoom)=>{if(!err)map.easeTo({center:f.geometry.coordinates,zoom})})});
  map.on('click','camera-point',e=>showPopup(e.features[0]));
  ['clusters','camera-point'].forEach(id=>{map.on('mouseenter',id,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',id,()=>map.getCanvas().style.cursor='')});
}
function showPopup(feature){
  const p=feature.properties,times=Array.isArray(p.event_times)?p.event_times:JSON.parse(p.event_times||'[]');
  const qualityLabel={intersection_verified:'双道路命中',poi_or_address:'POI/门牌命中',road_or_area_approximate:'道路级近似'}[p.geocode_quality]||p.geocode_quality;
  const html=`<div class="popup"><h3>${esc(p.location)}</h3><table><tr><td>卡口编号</td><td>${esc(p.camera_code||'—')}</td></tr><tr><td>过车次数</td><td><b>${p.hit_count}</b></td></tr><tr><td>解析质量</td><td>${esc(qualityLabel)}</td></tr><tr><td>百度返回</td><td>${esc(p.baidu_poi_title||'—')}</td></tr><tr><td>时间范围</td><td>${esc(p.first_seen)}<br>${esc(p.last_seen)}</td></tr><tr><td>WGS84</td><td>${Number(p.wgs84_lng).toFixed(6)}, ${Number(p.wgs84_lat).toFixed(6)}</td></tr><tr><td>百度查询</td><td>${esc(p.query_used)}</td></tr></table><div class="times">${times.map(t=>esc(t)).join('<br>')}</div></div>`;
  new mapboxgl.Popup({offset:14,maxWidth:'390px'}).setLngLat(feature.geometry.coordinates).setHTML(html).addTo(map);
}
function fitAll(){const b=new mapboxgl.LngLatBounds();DATA.points.features.forEach(f=>b.extend(f.geometry.coordinates));if(!b.isEmpty())map.fitBounds(b,{padding:{top:55,bottom:55,left:55,right:55},maxZoom:13.7,duration:900})}
map.on('load',()=>{addLayers();fitAll()});map.on('style.load',()=>{addLayers()});
function setStyle(name){if(name===currentStyle)return;currentStyle=name;map.setStyle(styles[name]);document.getElementById('streetBtn').classList.toggle('active',name==='street');document.getElementById('satelliteBtn').classList.toggle('active',name==='satellite')}
document.getElementById('streetBtn').onclick=()=>setStyle('street');document.getElementById('satelliteBtn').onclick=()=>setStyle('satellite');document.getElementById('fitBtn').onclick=fitAll;
document.getElementById('trackBtn').onclick=e=>{trackVisible=!trackVisible;['track-line','track-shadow'].forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',trackVisible?'visible':'none'));e.currentTarget.classList.toggle('active',trackVisible);e.currentTarget.textContent=`轨迹连线　${trackVisible?'开':'关'}`};
document.getElementById('heatBtn').onclick=e=>{heatVisible=!heatVisible;if(map.getLayer('camera-heat'))map.setLayoutProperty('camera-heat','visibility',heatVisible?'visible':'none');e.currentTarget.classList.toggle('active',heatVisible);e.currentTarget.textContent=`热力视图　${heatVisible?'开':'关'}`};
const list=document.getElementById('pointList'),search=document.getElementById('search');
function renderList(q=''){const term=q.trim().toLowerCase();const items=meta.top_points.filter(p=>p.location.toLowerCase().includes(term)).slice(0,100);list.innerHTML=items.map((p,i)=>`<div class="point" data-lng="${p.coordinates[0]}" data-lat="${p.coordinates[1]}" data-location="${esc(p.location)}"><div class="rank">${i+1}</div><div><div class="point-name">${esc(p.location)}</div><div class="point-time">${esc(p.last_seen)}</div></div><div class="count">${p.hit_count}</div></div>`).join('')||'<div class="empty">没有匹配点位</div>';
  list.querySelectorAll('.point').forEach(el=>el.onclick=()=>{const lng=Number(el.dataset.lng),lat=Number(el.dataset.lat);map.flyTo({center:[lng,lat],zoom:16.2});const feature=DATA.points.features.find(f=>f.properties.location===el.dataset.location);if(feature)showPopup(feature);if(innerWidth<=820)document.getElementById('sidebar').classList.remove('open')});
}
renderList();search.oninput=e=>renderList(e.target.value);document.getElementById('mobileToggle').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
</script></body></html>
